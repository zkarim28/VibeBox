<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap Race — Game Screen</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1e293b, #0b1120);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 4vh 4vw;
  }
  h1 { font-size: clamp(2rem, 6vw, 4rem); letter-spacing: -0.02em; }
  h1 span { color: #38bdf8; }
  .sub { margin-top: 0.5rem; color: #94a3b8; font-size: clamp(1rem, 2.5vw, 1.5rem); }
  .join {
    margin-top: 2rem; padding: 1.25rem 1.75rem 1.5rem; border-radius: 1rem;
    background: #111827; border: 1px solid #1f2937; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
  }
  .join .label { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .join .url { font-size: clamp(1.25rem, 4vw, 2.25rem); font-weight: 700; color: #fbbf24; }
  .join .qr {
    width: clamp(160px, 22vw, 260px); height: auto; border-radius: 0.6rem;
    background: #fff; padding: 0.75rem; image-rendering: pixelated;
  }
  .join .scan { color: #64748b; font-size: 0.9rem; }
  .stage { width: min(1100px, 100%); margin-top: 2.5rem; flex: 1; }
  .players { display: flex; flex-direction: column; gap: 1rem; }
  .row {
    display: grid; grid-template-columns: 12rem 1fr auto; align-items: center;
    gap: 1rem; background: #0f172a; border: 1px solid #1e293b;
    border-radius: 0.9rem; padding: 0.9rem 1.1rem;
  }
  .name { font-size: clamp(1rem, 2.5vw, 1.6rem); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 1.5rem; background: #1e293b; border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 999px; transition: width 0.12s linear; }
  .count { font-variant-numeric: tabular-nums; color: #94a3b8; min-width: 4rem; text-align: right; }
  .empty { text-align: center; color: #64748b; font-size: 1.25rem; padding: 3rem 0; }
  .banner {
    margin-top: 1.5rem; text-align: center; font-size: clamp(1.5rem, 5vw, 3rem);
    font-weight: 800;
  }
  .hint { margin-top: 2rem; color: #64748b; font-size: 0.95rem; text-align: center; }
  kbd {
    background: #1e293b; border: 1px solid #334155; border-bottom-width: 2px;
    border-radius: 0.4rem; padding: 0.1rem 0.45rem; font-family: inherit; font-size: 0.85em;
  }
  .pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  .back {
    position: fixed; top: 1rem; left: 1rem;
    background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
    font: inherit; font-size: 0.95rem; padding: 0.5rem 0.9rem;
    border-radius: 0.6rem; cursor: pointer;
  }
  .back:hover { background: #1e293b; }
  :where(button, a, [tabindex]):focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <button class="back" id="back" type="button">‹ Games menu</button>
  <h1>Tap<span>Race</span></h1>
  <div class="sub" id="sub">Get your phone out…</div>

  <div class="join">
    <div class="label">On your phone, go to</div>
    <div class="url" id="join-url">…</div>
    <img class="qr" id="qr" src="/phoneQR.png" alt="Scan to join">
    <div class="scan">…or scan this with your camera</div>
  </div>

  <div class="stage">
    <div class="players" id="players"><div class="empty">Waiting for players to join…</div></div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="hint">
    <kbd>Space</kbd> start / restart &nbsp;·&nbsp; <kbd>R</kbd> back to lobby
    &nbsp;·&nbsp; (players can also start from their phone)
  </div>

<script>
const $ = (id) => document.getElementById(id);

// Ask the server for the address phones should use (its LAN IP, not
// "localhost"), and refresh the QR to match. Re-checked periodically so
// switching WiFi networks updates the screen without a restart.
let shownIp = null;
async function refreshAddress() {
  try {
    const w = await (await fetch("/whoami", { cache: "no-store" })).json();
    $("join-url").textContent = w.playUrl.replace(/^https?:\/\//, "");
    // the initial <img src="/phoneQR.png"> is already correct; only repoint it
    // if the laptop's address actually changes while this page is open
    if (shownIp !== null && w.ip !== shownIp) {
      $("qr").src = "/phoneQR.png?ip=" + encodeURIComponent(w.ip);
    }
    shownIp = w.ip;
  } catch (e) {
    $("join-url").textContent = location.host + "/play";
  }
}
refreshAddress();
setInterval(refreshAddress, 10000);

let goal = 40;

let leaving = false;
function render(s) {
  // this screen only drives Tap Race — if the host picked something else
  // (or returned to the menu), follow them there
  if (!leaving && s.game !== "tap-race") { location.href = "/"; return; }
  goal = s.goal;
  const wrap = $("players");
  if (!s.players.length) {
    wrap.innerHTML = '<div class="empty">Waiting for players to join…</div>';
  } else {
    wrap.innerHTML = s.players.map(p => {
      const pct = Math.min(100, (p.taps / s.goal) * 100);
      return `
        <div class="row">
          <div class="name" style="color:${p.color}">${escapeHtml(p.name)}</div>
          <div class="bar"><div class="fill" style="width:${pct}%;background:${p.color}"></div></div>
          <div class="count">${p.taps} / ${s.goal}</div>
        </div>`;
    }).join("");
  }

  const banner = $("banner");
  if (s.phase === "lobby") {
    $("sub").textContent = s.players.length
      ? `${s.players.length} player${s.players.length > 1 ? "s" : ""} ready — press Space to start`
      : "Get your phone out…";
    banner.textContent = "";
    banner.className = "banner";
  } else if (s.phase === "playing") {
    $("sub").textContent = "GO! First to " + s.goal + " taps wins";
    banner.textContent = "RACE!";
    banner.className = "banner pulse";
  } else if (s.phase === "over") {
    $("sub").textContent = "Press Space to race again";
    banner.textContent = "🏆 " + (s.winner || "?") + " wins!";
    banner.className = "banner";
  }
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// --- live updates via server-sent events, with auto-reconnect ---
function connect() {
  const es = new EventSource("/events");
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = () => { es.close(); setTimeout(connect, 1000); };
}
connect();

// --- host keyboard controls: start / reset are game-wide, no pid needed ---
function control(action) {
  fetch("/input", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action })
  }).catch(() => {});
}
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (e.code === "Space") { e.preventDefault(); control("start"); }
  if (e.key.toLowerCase() === "r") { control("reset"); }
});

// --- back to the games menu ---
$("back").addEventListener("click", async () => {
  leaving = true;
  try {
    await fetch("/select", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ game: null })
    });
  } catch (e) {}
  location.href = "/";
});
</script>
</body>
</html>
